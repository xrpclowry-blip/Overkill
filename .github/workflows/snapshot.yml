name: Daily clan snapshot

on:
  schedule:
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Capture today's snapshot
        run: node scripts/snapshot.mjs
        env:
          CLAN: Overkill

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/history.json; then
            echo "No change today; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "Snapshot $(date -u +%Y-%m-%d)"
          git push
