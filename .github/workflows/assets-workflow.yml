name: Rebuild item assets

# Run this by hand — from the Actions tab — after a game update, or the first
# time to populate icons and combat stats. It is deliberately not on a schedule:
# the game's item data barely changes, and the job downloads a few hundred
# images from the community wiki, which is not something to do daily.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Extract item stats and fetch icons
        run: node scripts/assets.mjs

      - name: Commit whatever changed
        run: |
          if git diff --quiet -- data/; then
            echo "Assets already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/item-stats.json data/icons
          git commit -m "Rebuild item assets $(date -u +%Y-%m-%d)"
          git push
